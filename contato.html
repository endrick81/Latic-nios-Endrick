<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Laticínios Endrick</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

<header>
    <h1>Laticínios Endrick</h1>

    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="servicos.html">Produtos</a>
        <a href="contato.html" class="active">Contato</a>
    </nav>
</header>

<main>

    <section class="destaque">
        <h2>Entre em Contato</h2>

        <p>
            Entre em contato com a Laticínios Endrick.
        </p>

        <div class="card" style="margin: 30px auto;">

            <form id="formularioContato">

                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome"><br><br>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email"><br><br>

                <label for="mensagem">Mensagem:</label><br>
                <textarea id="mensagem" name="mensagem" rows="5"></textarea><br><br>

                <button type="submit" class="botao">
                    Enviar mensagem
                </button>

            </form>

        </div>

        <div class="card" style="margin: 30px auto;">
            <h3>Informações</h3>

            <p>
                <strong>Endereço:</strong>
                Alpes Suíços, Suíça
            </p>

            <p>
                <strong>Telefone:</strong>
                (00) 00000-0000
            </p>
        </div>

    </section>

</main>

<footer>
    <p>&copy; 2026 Laticínios Endrick. Todos os direitos reservados.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
